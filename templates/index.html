<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groq AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-200 flex flex-col h-screen">

    <!-- Header -->
    <header class="p-4 border-b border-gray-300 dark:border-gray-800 bg-white dark:bg-gray-900 flex justify-between items-center max-w-4xl w-full mx-auto">
        <h1 class="text-xl font-bold text-emerald-600 dark:text-emerald-400">🤖 AbdulGPT</h1>
        
        <!-- Light / Dark Mode Toggle Button -->
        <button id="theme-toggle" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-700 transition">
            <span id="theme-icon">🌙</span>
        </button>
    </header>

    <!-- Chat Messages Container -->
    <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl w-full mx-auto">
        <div class="bg-gray-200 dark:bg-gray-800 p-3 rounded-lg max-w-md self-start text-gray-800 dark:text-gray-200">
            Hello! How can I help you today? 
        </div>
    </div>

    <!-- Attachment Preview Bar -->
    <div id="file-preview-bar" class="hidden max-w-4xl w-full mx-auto px-4 py-2 bg-gray-200 dark:bg-gray-800 border-t border-gray-300 dark:border-gray-700 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <span id="file-preview-name" class="text-sm font-medium text-emerald-600 dark:text-emerald-400"></span>
        </div>
        <button id="remove-file-btn" class="text-red-500 hover:text-red-700 text-xs font-bold px-2 py-1">✕ Remove</button>
    </div>

    <!-- Input Area -->
    <div class="p-4 border-t border-gray-300 dark:border-gray-800 bg-white dark:bg-gray-900 max-w-4xl w-full mx-auto">
        <form id="chat-form" class="flex items-center gap-2">
            
            <!-- Hidden File Input -->
            <input type="file" id="file-input" class="hidden" accept="image/*,.txt,.py,.js,.html,.css,.json,.csv,.md">
            
            <!-- Plus (+) Attachment Button -->
            <button type="button" id="attach-btn" title="Attach file or image"
                class="bg-gray-200 hover:bg-gray-300 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 p-3 rounded-lg font-bold text-xl transition flex items-center justify-center h-12 w-12">
                +
            </button>

            <!-- Text Input -->
            <input type="text" id="user-input" placeholder="Type a message..."
                class="flex-1 p-3 bg-gray-100 dark:bg-gray-800 rounded-lg border border-gray-300 dark:border-gray-700 focus:outline-none focus:border-emerald-500 text-gray-800 dark:text-white">
            
            <!-- Send Button -->
            <button type="submit" 
                class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-3 rounded-lg font-semibold transition h-12">
                Send
            </button>
        </form>
    </div>

    <script>
        // DOM Elements
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');
        const attachBtn = document.getElementById('attach-btn');
        const fileInput = document.getElementById('file-input');
        const filePreviewBar = document.getElementById('file-preview-bar');
        const filePreviewName = document.getElementById('file-preview-name');
        const removeFileBtn = document.getElementById('remove-file-btn');

        // File State
        let attachedFile = null;
        let attachedImageBase64 = null;
        let attachedTextContent = null;

        // --- Theme Logic ---
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
                themeIcon.innerText = '☀️';
            } else {
                document.documentElement.classList.add('dark');
                themeIcon.innerText = '🌙';
            }
        }
        themeToggleBtn.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.innerText = isDark ? '🌙' : '☀️';
        });
        initTheme();

        // --- File Attachment Logic ---
        attachBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            attachedFile = file;
            filePreviewName.innerText = `📎 ${file.name}`;
            filePreviewBar.classList.remove('hidden');

            const reader = new FileReader();

            // If it's an image, convert to Base64 for Vision API
            if (file.type.startsWith('image/')) {
                reader.onload = (evt) => {
                    attachedImageBase64 = evt.target.result;
                    attachedTextContent = null;
                };
                reader.readAsDataURL(file);
            } else {
                // If text/code file, read as text
                reader.onload = (evt) => {
                    attachedTextContent = evt.target.result;
                    attachedImageBase64 = null;
                };
                reader.readAsText(file);
            }
        });

        removeFileBtn.addEventListener('click', clearAttachment);

        function clearAttachment() {
            attachedFile = null;
            attachedImageBase64 = null;
            attachedTextContent = null;
            fileInput.value = '';
            filePreviewBar.classList.add('hidden');
        }

        // --- Message Handling ---
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            let message = userInput.value.trim();

            if (!message && !attachedImageBase64 && !attachedTextContent) return;

            let displayMessage = message;

            // If code/text file attached, append file contents to the user prompt behind the scenes
            if (attachedTextContent) {
                displayMessage = (message ? `${message}\n\n` : '') + `[Attached File: ${attachedFile.name}]`;
                message = `${message}\n\n--- Contents of attached file (${attachedFile.name}) ---\n${attachedTextContent}`;
            } else if (attachedImageBase64 && !message) {
                displayMessage = `[Attached Image: ${attachedFile.name}]`;
            }

            // Render User Message
            appendMessage(displayMessage, 'user');
            userInput.value = '';

            const payload = {
                message: message,
                image: attachedImageBase64
            };

            clearAttachment();

            // Render Bot Thinking State
            const botMessageDiv = appendMessage('Thinking...', 'bot');

            try {
                const res = await fetch('http://127.0.0.1:5000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                botMessageDiv.innerText = data.response || data.error || "Error fetching response.";
            } catch (err) {
                botMessageDiv.innerText = "Error connecting to backend.";
            }
        });

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = sender === 'user' 
                ? 'bg-emerald-600 text-white ml-auto max-w-md p-3 rounded-lg text-sm font-medium whitespace-pre-wrap' 
                : 'bg-gray-200 dark:bg-gray-800 text-gray-800 dark:text-gray-200 mr-auto max-w-md p-3 rounded-lg text-sm whitespace-pre-wrap';
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }
    </script>
</body>
</html>
