<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <!-- Viewport meta tag optimized for mobile responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AbdulGPT</title>

    <!-- Custom CSS File -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Marked.js CDN for Markdown Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            500: '#10b981',
                            600: '#059669',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white dark:bg-zinc-950 text-gray-900 dark:text-zinc-100 font-sans antialiased h-dvh flex overflow-hidden">

    <!-- Mobile Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity"></div>

    <!-- Sidebar Drawer -->
    <aside id="sidebar" class="fixed sm:static inset-y-0 left-0 z-50 w-64 bg-gray-50 dark:bg-zinc-900 border-r border-gray-200 dark:border-zinc-800 flex flex-col transform -translate-x-full sm:translate-x-0 transition-transform duration-200 ease-in-out">
        <!-- Sidebar Header -->
        <div class="p-4 flex items-center justify-between border-b border-gray-200 dark:border-zinc-800">
            <button id="new-chat-btn" type="button" class="flex-1 flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2 px-3 rounded-xl transition shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                <span>New Chat</span>
            </button>
            <button id="close-sidebar-btn" type="button" class="sm:hidden p-2 text-gray-500 hover:text-gray-700 dark:text-zinc-400 dark:hover:text-white rounded-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>

        <!-- Recent Threads List -->
        <div class="flex-1 overflow-y-auto p-3 space-y-1" id="conversation-list">
            <!-- Populated via JavaScript -->
        </div>

        <!-- Sidebar Footer -->
        <div class="p-3 border-t border-gray-200 dark:border-zinc-800 text-xs text-gray-500 dark:text-zinc-500 text-center">
            AbdulGPT 
        </div>
    </aside>

    <!-- Main Workspace Area -->
    <div class="flex-1 flex flex-col h-full min-w-0">

        <!-- Top Navigation Header -->
        <header class="flex items-center justify-between px-4 py-3 border-b border-gray-200 dark:border-zinc-800 bg-white/80 dark:bg-zinc-950/80 backdrop-blur-md shrink-0">
            <div class="flex items-center gap-3">
                <button id="toggle-sidebar-btn" type="button" class="sm:hidden text-gray-600 dark:text-zinc-400 hover:text-gray-900 dark:hover:text-white p-1 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <div class="flex items-center gap-2">
                    <h1 class="font-bold text-base tracking-tight text-gray-900 dark:text-white">AbdulGPT</h1>
                    <span class="text-[10px] font-semibold text-emerald-600 dark:text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">V2.1</span>
                </div>
            </div>

            <!-- Header Controls (Model Select & Theme Toggle) -->
            <div class="flex items-center gap-2">
                <select id="model-select" class="bg-gray-100 dark:bg-zinc-900 text-gray-800 dark:text-zinc-200 border border-gray-200 dark:border-zinc-800 text-xs rounded-xl px-2.5 py-1.5 focus:outline-none focus:ring-1 focus:ring-emerald-500/50 transition cursor-pointer max-w-[130px] sm:max-w-none truncate">
                    <option value="llama-3.3-70b-versatile" selected>Llama 3.3 (70B)</option>
                    <option value="openai/gpt-oss-120b">GPT OSS (120B)</option>
                    <option value="openai/gpt-oss-20b">GPT OSS (20B)</option>
                    <option value="llama-3.1-8b-instant">Llama 3.1 (8B)</option>
                </select>

                <!-- Responsive Theme Toggle Button -->
                <button id="theme-toggle" type="button" aria-label="Toggle Theme" class="p-2 text-gray-600 dark:text-zinc-400 hover:text-gray-900 dark:hover:text-white rounded-xl hover:bg-gray-100 dark:hover:bg-zinc-800/80 transition flex items-center justify-center">
                    <span id="theme-icon" class="text-base leading-none">🌙</span>
                </button>
            </div>
        </header>

        <!-- Chat Output Scroll Area -->
        <main id="chat-box" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 max-w-4xl w-full mx-auto">
            <div class="flex items-start max-w-3xl">
                <div class="flex-1 bg-gray-100 dark:bg-zinc-900/90 border border-gray-200 dark:border-zinc-800/80 p-4 rounded-2xl rounded-tl-sm text-gray-800 dark:text-zinc-200 text-sm leading-relaxed shadow-sm">
                    Hello! I'm <strong>AbdulGPT</strong>. Ask me questions, upload code files, attach images, or upload PDFs for instant analysis.
                </div>
            </div>
        </main>

        <!-- Bottom Input Console with Safe Area Padding & Fixed Shrink -->
        <footer class="p-3 sm:p-4 bg-white dark:bg-zinc-950 border-t border-gray-200 dark:border-zinc-800 shrink-0 pb-[max(0.75rem,env(safe-area-inset-bottom))]">
            <div class="max-w-4xl mx-auto w-full">

                <!-- File Attachment Preview Bar -->
                <div id="file-preview-bar" class="hidden mb-2 p-2 px-3 bg-gray-100 dark:bg-zinc-900 border border-gray-200 dark:border-zinc-800 rounded-xl flex items-center justify-between text-xs text-gray-700 dark:text-zinc-300">
                    <div class="flex items-center gap-2 truncate">
                        <svg class="w-4 h-4 text-emerald-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg>
                        <span id="file-preview-name" class="truncate font-medium">filename.pdf</span>
                    </div>
                    <button id="remove-file-btn" type="button" class="text-gray-400 hover:text-red-500 transition p-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>

                <!-- Input Form Container -->
                <form id="chat-form" class="relative flex items-center gap-2 bg-gray-100 dark:bg-zinc-900 border border-gray-200 dark:border-zinc-800 rounded-2xl p-2 focus-within:border-emerald-500/50 transition">
                    
                    <!-- Hidden File Input -->
                    <input type="file" id="file-input" class="hidden" accept="image/*,.pdf,.txt,.py,.js,.html,.css,.json">
                    
                    <!-- Attachment Trigger Button -->
                    <button id="attach-btn" type="button" class="p-2 text-gray-500 dark:text-zinc-400 hover:text-emerald-500 dark:hover:text-emerald-400 rounded-xl hover:bg-gray-200 dark:hover:bg-zinc-800 transition shrink-0">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    </button>

                    <!-- Textarea Input (Font size 16px/text-base to prevent mobile safari zoom) -->
                    <textarea 
                        id="user-input" 
                        rows="1" 
                        placeholder="Ask AbdulGPT..." 
                        class="w-full bg-transparent resize-none overflow-y-auto max-h-32 focus:outline-none text-base sm:text-sm text-gray-800 dark:text-zinc-100 placeholder-gray-500 py-1.5 px-1 leading-normal"
                    ></textarea>

                    <!-- Send Button -->
                    <button id="send-btn" type="submit" class="p-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl transition shrink-0 shadow-sm flex items-center justify-center">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                    </button>
                </form>

                <p class="text-[11px] text-center text-gray-400 dark:text-zinc-500 mt-2">
                    AbdulGPT can make mistakes. Verify important info.
                </p>
            </div>
        </footer>
    </div>

    <!-- Application JavaScript File -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
