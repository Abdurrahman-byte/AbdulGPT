<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groq AI Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col h-screen">

    <!-- Header -->
    <header class="p-4 border-b border-gray-800 text-center text-xl font-bold text-emerald-400">
        🤖 Abdul's Assistant
    </header>

    <!-- Chat Messages Window -->
    <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
        <div class="bg-gray-800 p-3 rounded-lg max-w-md self-start text-gray-200">
            Hello! How can I help you today? 🤓
        </div>
    </div>

    <!-- Input Area -->
    <div class="p-4 border-t border-gray-800 max-w-3xl w-full mx-auto">
        <form id="chat-form" class="flex gap-2">
            <input type="text" id="user-input" placeholder="Type a message..." required
                class="flex-1 p-3 bg-gray-800 rounded-lg border border-gray-700 focus:outline-none focus:border-emerald-500">
            <button type="submit" 
                class="bg-emerald-600 hover:bg-emerald-500 px-5 py-3 rounded-lg font-semibold transition">
                Send
            </button>
        </form>
    </div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            // Render User Message
            appendMessage(message, 'user');
            userInput.value = '';

            // Render Placeholder Bot Message
            const botMessageDiv = appendMessage('Thinking...', 'bot');

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await res.json();
                botMessageDiv.innerText = data.response || "Error fetching response.";
            } catch (err) {
                botMessageDiv.innerText = "Error connecting to backend.";
            }
        });

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = sender === 'user' 
                ? 'bg-emerald-700 ml-auto max-w-md p-3 rounded-lg text-white' 
                : 'bg-gray-800 mr-auto max-w-md p-3 rounded-lg text-gray-200';
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }
    </script>
</body>
</html>
